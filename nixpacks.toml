[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npx --yes pnpm@11.19.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@11.19.0 --filter @devio/database generate && npx --yes pnpm@11.19.0 --filter @devio/api build"]

[start]
cmd = "npx --yes pnpm@11.19.0 --filter @devio/api start"

